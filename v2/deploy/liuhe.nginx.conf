# Liuhe Pagoda: the static site, for anyone who opens the server by its IP address
# (http://43.167.184.15/). The named sites on this server (zjurun.xyz, airoport.xyz) still match
# their own server_name; before this, a bare-IP request only got a 404.
# Installed by tools/deploy.sh as /etc/nginx/sites-available/liuhe (+ link in sites-enabled).
server {
    listen 80 default_server;
    server_name _;

    root /var/www/liuhe;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # file names with a content hash never change: cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # the videos and pictures keep their names when they are rendered again: browsers ask each
    # time (a 304 when nothing changed), so a new render shows at once
    location /media/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /draco/ {
        expires 30d;
        try_files $uri =404;
    }

    # the page itself: always ask, so a new version shows at once
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
